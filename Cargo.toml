[package]
name = "ggvoice"
version = "1.0.3"
edition = "2021"

[dependencies]
cpal = "0.15"
ringbuf = "0.4"
nnnoiseless = "0.5"
opus = "0.3"
anyhow = "1.0"
chacha20poly1305 = "0.10"
rand = "0.8"
base64 = "0.22"
eframe = "0.29"
arboard = "3.4"
ureq = "2.10"
sha2 = "0.10"
image = "0.25"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
winresource = "0.1"
image = "0.25"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true